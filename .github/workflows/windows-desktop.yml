name: Sonariq Windows Desktop

# Sonariq for Windows: builds the full desktop app (Compose Multiplatform,
# :desktopApp) on a real Windows runner — jpackage can only produce the
# .exe installer and .msi on Windows itself, with WiX Toolset 3.
# Manual dispatch only, so Android pushes on this branch are unaffected.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true
        default: "2.3.5"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows - installer, msi, portable
    runs-on: windows-latest
    # Build-time only: the desktop app reads this into a system property for
    # AI word sync (see desktopApp/build.gradle.kts). The value lives solely
    # in the repo secret and never appears in any committed file.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://sonariq-ohhb.onrender.com" >> local.properties
          if [ -n "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY=$GROQ_API_KEY" >> local.properties
          fi

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Psonariq.version=${{ inputs.version }}"

      - name: Build exe, msi and the app image
        run: .\gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi :desktopApp:createDistributable "-Psonariq.version=${{ inputs.version }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Sonariq/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/sonariq_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/sonariq_smtc.dll'

      # Proves the packaged app actually opens on a real Windows machine, not
      # just that it compiles: starts the app image's Sonariq.exe, requires
      # the process to stay alive with a real top-level window titled
      # "Sonariq", fails on an early exit or a JVM crash log, and saves a
      # screenshot plus a text report as the windows-launch-test artifact.
      - name: Launch test - the packaged app opens its window
        shell: pwsh
        run: |
          $report = New-Object System.Collections.Generic.List[string]
          $appDir = Join-Path $env:GITHUB_WORKSPACE "desktopApp/build/compose/binaries/main/app/Sonariq"
          $exe = Join-Path $appDir "Sonariq.exe"
          $report.Add("exe: $exe")
          $p = Start-Process -FilePath $exe -WorkingDirectory $appDir -PassThru
          $report.Add("started pid: $($p.Id) at $(Get-Date -Format o)")

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class WinEnum {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          }
          "@

          # The launcher hands off to a child process of the same name, so
          # track every Sonariq process, not just the started pid, and accept
          # the app's window under any of them (run 39957849535: the window
          # was on screen while the launcher pid itself stayed idle).
          $deadline = (Get-Date).AddSeconds(150)
          $found = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $appProcs = @(Get-Process -Name "Sonariq" -ErrorAction SilentlyContinue)
            if ($appProcs.Count -eq 0) { break }
            $script:hit = $null
            [WinEnum]::EnumWindows({ param($h, $l)
              $wpid = 0
              [WinEnum]::GetWindowThreadProcessId($h, [ref]$wpid) | Out-Null
              if ([WinEnum]::IsWindowVisible($h)) {
                $sb = New-Object System.Text.StringBuilder 256
                [WinEnum]::GetWindowText($h, $sb, 256) | Out-Null
                if ($sb.ToString() -eq "Sonariq") {
                  $script:hit = "pid=$wpid handle=$h title='Sonariq'"
                }
              }
              return $true
            }, [IntPtr]::Zero) | Out-Null
            if ($script:hit) { $found = $script:hit; break }
            foreach ($ap in $appProcs) {
              if ($ap.MainWindowHandle -ne [IntPtr]::Zero -and $ap.MainWindowTitle -eq "Sonariq") {
                $found = "pid=$($ap.Id) main-window handle=$($ap.MainWindowHandle) title='Sonariq'"
                break
              }
            }
            if ($found) { break }
          }

          $failed = $false
          $appProcs = @(Get-Process -Name "Sonariq" -ErrorAction SilentlyContinue)
          if ($appProcs.Count -eq 0) {
            $failed = $true
            $report.Add("FAIL: no Sonariq process is running")
          } else {
            $cpuTotal = ($appProcs | ForEach-Object { $_.TotalProcessorTime.TotalSeconds } | Measure-Object -Sum).Sum
            $pidList = ($appProcs | ForEach-Object { $_.Id }) -join ', '
            $report.Add("Sonariq processes alive: $pidList, total cpu=$([math]::Round($cpuTotal,1))s")
          }
          if ($found) { $report.Add("window: $found") } else { $failed = $true; $report.Add("FAIL: no Sonariq window found") }

          $crash = Get-ChildItem $appDir -Filter "hs_err_pid*.log" -ErrorAction SilentlyContinue
          if ($crash) { $failed = $true; $report.Add("FAIL: JVM crash log present: $($crash.Name)") }

          $dataDirs = @()
          foreach ($root in @($env:APPDATA, $env:LOCALAPPDATA)) {
            $dataDirs += Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "sonariq" } | ForEach-Object { $_.FullName }
          }
          $report.Add("app data dirs: $($dataDirs -join ', ')")

          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot = Join-Path $env:GITHUB_WORKSPACE "launch-screenshot.png"
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $small = New-Object System.Drawing.Bitmap 64, 64
            $g2 = [System.Drawing.Graphics]::FromImage($small)
            $g2.DrawImage($bmp, 0, 0, 64, 64)
            $nonBlack = 0
            for ($x = 0; $x -lt 64; $x++) { for ($y = 0; $y -lt 64; $y++) {
              $c = $small.GetPixel($x, $y)
              if (($c.R + $c.G + $c.B) -gt 24) { $nonBlack++ }
            } }
            $report.Add("screenshot: $shot, non-black sample pixels $nonBlack / 4096")
          } catch {
            $report.Add("screenshot failed: $($_.Exception.Message)")
          }

          $report | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE "launch-report.txt")
          Get-Process -Name "Sonariq" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }

      - name: Upload launch test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-test
          path: |
            launch-report.txt
            launch-screenshot.png
          if-no-files-found: ignore

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/Sonariq-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Sonariq-$v-windows-x64-setup.exe"
          # Zip from inside the app folder so the portable carries a clean
          # top-level Sonariq folder, not the build tree's path.
          Push-Location "desktopApp/build/compose/binaries/main/app"
          7z a -tzip -mx=5 "$env:GITHUB_WORKSPACE/dist/Sonariq-$v-windows-x64-portable.zip" "Sonariq" | Out-Null
          Pop-Location
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonariq-windows-desktop
          path: dist/*

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
